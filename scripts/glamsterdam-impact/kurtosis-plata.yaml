# Minimal Platåberget (Glamsterdam devnet-8) network for Resonate contract and
# ERC-4337 compatibility checks. The client images and fork epoch follow the
# official devnet-8 local-testing specification:
# https://notes.ethereum.org/@ethpandaops/glamsterdam-devnet-8
participants:
  - el_type: geth
    el_image: ethpandaops/geth:glamsterdam-devnet-8
    cl_type: lodestar
    cl_image: ethpandaops/lodestar:glamsterdam-devnet-8

network_params:
  preset: minimal
  gloas_fork_epoch: 1
  additional_preloaded_contracts:
    "0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266":
      balance: "10000ETH"
      code: "0x"
      storage: {}
      nonce: 0

port_publisher:
  el:
    enabled: true
    public_port_start: 32000

additional_services: []
