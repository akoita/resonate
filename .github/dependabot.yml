version: 2

# Routine version updates are consolidated into one monthly cross-ecosystem PR.
# Security updates remain event-driven through GitHub's enabled native setting
# and are grouped into one PR per affected ecosystem.
multi-ecosystem-groups:
  monthly-routine-updates:
    open-pull-requests-limit: 5
    schedule:
      interval: monthly
      time: "04:00"
      timezone: Europe/Paris
    commit-message:
      prefix: deps

updates:
  - package-ecosystem: npm
    directories:
      - "/"
      - /backend
      - /web
      - /desktop
      - /examples/mcp-client
      - /scripts/staging-smoke
      - /workers/analytics-dataflow/dataform-cli
    patterns: ["*"]
    multi-ecosystem-group: monthly-routine-updates
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  # The archived experiments/stable-audio-3-spike tree is intentionally not
  # configured: it is outside the production policy and maintained graph.
  - package-ecosystem: pip
    directories:
      - /workers/analytics-dataflow
      - /workers/demucs
      - /workers/stable-audio
    patterns: ["*"]
    multi-ecosystem-group: monthly-routine-updates
    groups:
      pip-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /backend
      - /web
      - /workers/analytics-dataflow
      - /workers/demucs
      - /workers/stable-audio
    patterns: ["*"]
    multi-ecosystem-group: monthly-routine-updates
    groups:
      docker-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: monthly-routine-updates

  # contracts/scripts/install-deps.sh builds exactly the commit each gitlink
  # records, so a submodule bump here is what CI builds and tests.
  # account-abstraction is held on v0.7.0 while the application profile targets
  # EntryPoint v0.7 (install-deps.sh also refuses any other commit); Dependabot
  # submodule updates follow the default branch, so the submodule is ignored
  # outright rather than by version.
  - package-ecosystem: gitsubmodule
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: monthly-routine-updates
    ignore:
      - dependency-name: contracts/lib/account-abstraction
