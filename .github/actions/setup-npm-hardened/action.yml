name: Setup hardened npm
description: Install Node.js and pin npm 11 so npm supply-chain hardening config is enforced.
inputs:
  cache-dependency-path:
    description: Newline-separated lockfile paths used by setup-node cache.
    required: true
  node-version:
    description: Node.js version to install.
    required: false
    default: "24"
runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: "npm"
        cache-dependency-path: ${{ inputs.cache-dependency-path }}

    - name: Pin npm CLI
      shell: bash
      run: |
        set -euo pipefail
        npm install -g npm@11.14.1
        npm --version
        npm_cli_path="$(npm root --global)/npm/bin/npm-cli.js"
        test -f "$npm_cli_path"
        echo "HARDENED_NPM_CLI_PATH=$npm_cli_path" >> "$GITHUB_ENV"
