name: Nightly Full Validation

# Runs the complete CI validation graph against `main` once a night (#1748).
# The post-merge `main` receipt deliberately skips application validation, and
# path filters skip E2E for non-web changes, so without this workflow the
# release plane is the first full run after a merge: an E2E flake or a
# regression only surfaces while an operator is dispatching Release Deployment.
# This is validation-only — it never publishes an image, deploys, or mints
# cloud credentials.

on:
  schedule:
    - cron: "0 1 * * *" # nightly 01:00 UTC
  workflow_dispatch:

permissions:
  contents: read

# Own group so a nightly run is never cancelled by the CI workflow's own
# concurrency handling; the group differs from the called workflow's group, so
# the reusable invocation cannot queue behind its own caller.
concurrency:
  group: nightly-full-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Mirrors how release-deployment.yml invokes CI: the same reusable workflow
  # with release_validation, which makes classify-ci-changes.sh run the complete
  # graph instead of the path-filtered subset.
  validate:
    name: Full Validation Graph
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      release_validation: true

  report-failure:
    name: Report Nightly Failure
    needs: [validate]
    # Unlike the four newly-wired workflows (schedule-only, because a manual
    # dispatch of those is someone experimenting), this one also reports on
    # workflow_dispatch: this workflow's own purpose (see header) is to be the
    # pre-release gate an operator runs before Release Deployment, it takes no
    # inputs, and a dispatched run executes the identical graph a scheduled run
    # does — so it deserves the same durable record and the same close-on-success
    # behavior. Do not narrow this to schedule-only to match the other four.
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report scheduled outcome
        uses: ./.github/actions/report-scheduled-failure
        with:
          workflow-name: Nightly full validation
          issue-title: Nightly full validation failed on main
          label: nightly-validation-failure
          body-context: >-
            The nightly complete validation graph on `main` (#1748) failed.
            Decide whether it blocks the next **Release Deployment** dispatch:
            that workflow re-validates the exact release source with the same
            complete graph, so a red nightly usually fails the release the
            same way. Fix or triage the failure before dispatching, and record
            flaky-versus-real triage on this issue.
          outcome: ${{ (needs.validate.result == 'success') && 'success' || 'failure' }}
          token: ${{ github.token }}
