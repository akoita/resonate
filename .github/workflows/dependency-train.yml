name: Dependency Train

# Scheduled workflows execute from the repository's default branch.  The
# explicit ref guard below also makes a manually selected non-default ref a
# no-op, so write access is never granted to source-branch code.
#
# Publishing uses a dedicated GitHub App installed only on this repository.
# The app has repository permissions `contents: write` and
# `pull requests: write`; its installation token is minted per run from the
# DEPENDENCY_TRAIN_APP_ID and DEPENDENCY_TRAIN_APP_PRIVATE_KEY secrets. This
# keeps the repository-wide "Actions can create pull requests" setting off and
# still lets the app-authored review PR trigger CI.
on:
  schedule:
    - cron: "15 6 * * 1"
  workflow_dispatch:

concurrency:
  group: dependency-train
  cancel-in-progress: false

# The job narrows this to write access only where it must publish the train
# branch and maintain its review pull request.
permissions:
  contents: read

env:
  BASE_BRANCH: main
  TRAIN_BRANCH: automation/dependency-train

jobs:
  rebuild:
    name: Rebuild dependency train
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      checks: read
      pull-requests: write
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Mint dependency train installation token
        id: dependency-train-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.DEPENDENCY_TRAIN_APP_ID }}
          private-key: ${{ secrets.DEPENDENCY_TRAIN_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Configure non-interactive GitHub authentication
        env:
          GH_TOKEN: ${{ steps.dependency-train-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_REF: refs/heads/main
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "${EXPECTED_REF}" ]]; then
            echo "Refusing to run dependency train outside the default branch." >&2
            exit 1
          fi
          git remote set-url origin "https://github.com/${REPOSITORY}.git"
          gh auth setup-git
          hooks_directory="${RUNNER_TEMP}/dependency-train-empty-hooks"
          mkdir -p "${hooks_directory}"
          git config --local core.hooksPath "${hooks_directory}"
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local fetch.recurseSubmodules false
          git config --local protocol.file.allow never

      - name: Rebuild and publish the review train
        env:
          GH_TOKEN: ${{ steps.dependency-train-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 scripts/dependency_train.py \
            --repository-root "${GITHUB_WORKSPACE}" \
            --repository "${REPOSITORY}" \
            --base-branch "${BASE_BRANCH}" \
            --train-branch "${TRAIN_BRANCH}"

  report-failure:
    name: Report Dependency Train Failure
    needs: [rebuild]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report scheduled outcome
        uses: ./.github/actions/report-scheduled-failure
        with:
          workflow-name: Dependency Train
          issue-title: Dependency train failed on main
          body-context: >-
            The batched dependency review branch is not reaching a pull request
            (#1768). Open the failing run to identify the cause before the next
            scheduled rebuild is due.
          outcome: ${{ (needs.rebuild.result == 'success') && 'success' || 'failure' }}
          token: ${{ github.token }}
