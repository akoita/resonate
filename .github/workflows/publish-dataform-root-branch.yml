name: Publish Dataform Root Branch

# Managed GCP Dataform compiles a git repository whose ROOT holds
# workflow_settings.yaml, but the Dataform project lives at
# workers/analytics-dataflow/dataform/ in this monorepo (#2115). On every
# relevant push to main this workflow builds a root-level copy of the project,
# proves it compiles with the pinned Dataform CLI, and force-publishes it as a
# single orphan commit to the generated branch dataform/main.
#
# dataform/main is generated output: it is overwritten on every publish and must
# never be edited or merged. Deployment wiring is tracked outside this repository.

on:
  push:
    branches:
      - main
    paths:
      - workers/analytics-dataflow/dataform/**
      - workers/analytics-dataflow/dataform-cli/**
      - workers/analytics-dataflow/scripts/build_dataform_root_tree.py
      - workers/analytics-dataflow/scripts/check_dataform_root_tree.sh
      - .github/workflows/publish-dataform-root-branch.yml
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

concurrency:
  group: publish-dataform-root-branch
  cancel-in-progress: false

jobs:
  # The pinned Dataform CLI (3.0.71) carries known-vulnerable transitive
  # dependencies (vm2, braces) with no non-breaking fix. It only compiles
  # first-party definitions from main, but it must never share a job with a
  # write-capable token: build here with read-only permissions and hand the
  # tree to the publish job as an artifact.
  build:
    name: Build and compile tree
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup hardened npm
        uses: ./.github/actions/setup-npm-hardened
        with:
          node-version: "24"
          cache-dependency-path: workers/analytics-dataflow/dataform-cli/package-lock.json

      - name: Install pinned Dataform CLI
        run: node ../../../scripts/hardened-npm-install.mjs --project workers/analytics-dataflow/dataform-cli
        working-directory: workers/analytics-dataflow/dataform-cli

      - name: Build generated Dataform root tree
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 workers/analytics-dataflow/scripts/build_dataform_root_tree.py \
            --source workers/analytics-dataflow/dataform \
            --out "${RUNNER_TEMP}/tree" \
            --source-commit "${SOURCE_COMMIT}"

      # Gate: never publish a tree that does not compile.
      - name: Compile generated Dataform root tree
        run: bash workers/analytics-dataflow/scripts/check_dataform_root_tree.sh "${RUNNER_TEMP}/tree"

      - name: Upload generated tree
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dataform-root-tree
          path: ${{ runner.temp }}/tree
          if-no-files-found: error
          retention-days: 7

  # Runs no npm, no Dataform CLI and no repository code: git only.
  publish:
    name: Publish dataform/main
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Download generated tree
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dataform-root-tree
          path: ${{ runner.temp }}/tree

      - name: Publish generated branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_COMMIT: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          TARGET_BRANCH: dataform/main
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git"
          source_path="workers/analytics-dataflow/dataform"

          cd "${RUNNER_TEMP}/tree"
          git init --quiet
          git add --all
          git \
            -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet \
            -m "Generated Dataform project from ${SOURCE_COMMIT}" \
            -m "Generated from ${source_path} at ${SOURCE_COMMIT} by .github/workflows/publish-dataform-root-branch.yml. This branch is generated output: it is overwritten on every publish and must not be edited or merged."
          new_commit="$(git rev-parse HEAD)"
          new_tree="$(git rev-parse 'HEAD^{tree}')"

          existing_tree=""
          if git fetch --quiet --depth=1 "${remote}" "+refs/heads/${TARGET_BRANCH}:refs/remotes/published/${TARGET_BRANCH}" 2>/dev/null; then
            existing_tree="$(git rev-parse --verify --quiet "refs/remotes/published/${TARGET_BRANCH}^{tree}" || true)"
          else
            echo "No existing ${TARGET_BRANCH} branch (or it could not be fetched); publishing."
          fi

          {
            echo "### Dataform root branch"
            echo "- Source commit: \`${SOURCE_COMMIT}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

          if [[ -n "${existing_tree}" && "${existing_tree}" == "${new_tree}" ]]; then
            echo "Tree ${new_tree} already published on ${TARGET_BRANCH}; nothing to do."
            echo "- Result: no-op (published tree already identical)" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          git push --force "${remote}" "HEAD:refs/heads/${TARGET_BRANCH}"
          echo "Published ${new_commit} to ${TARGET_BRANCH}."
          {
            echo "- Result: pushed"
            echo "- Published commit: \`${new_commit}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
