name: Deploy Handoff

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: "Paste the numeric CI run ID from /actions/runs/<id> for a successful push on main or develop (example: 24707254354)"
        required: true
        type: string

env:
  RESONATE_IAC_REPOSITORY: akoita/resonate-iac
  RESONATE_DEPLOY_EVENT: resonate_deploy

jobs:
  dispatch:
    name: Dispatch Non-Prod Deploy
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      - name: Normalize trigger context
        id: trigger
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CI_RUN_ID: ${{ inputs.ci_run_id || '' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          run_id=""
          run_number=""
          head_branch=""
          head_sha=""
          run_event=""
          run_conclusion=""

          if [[ "${EVENT_NAME}" == "workflow_run" ]]; then
            run_id="${{ github.event.workflow_run.id }}"
            run_number="${{ github.event.workflow_run.run_number }}"
            head_branch="${{ github.event.workflow_run.head_branch }}"
            head_sha="${{ github.event.workflow_run.head_sha }}"
            run_event="${{ github.event.workflow_run.event }}"
            run_conclusion="${{ github.event.workflow_run.conclusion }}"
          else
            response="$(curl --fail-with-body \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${INPUT_CI_RUN_ID}")"

            export GH_RUN_RESPONSE="${response}"
            python3 -c 'import json, os, shlex; payload = json.loads(os.environ["GH_RUN_RESPONSE"]); pairs = (("run_id", payload["id"]), ("run_number", payload["run_number"]), ("head_branch", payload["head_branch"]), ("head_sha", payload["head_sha"]), ("run_event", payload["event"]), ("run_conclusion", payload["conclusion"] or "")); [print(f"{key}={shlex.quote(str(value))}") for key, value in pairs]' > "${RUNNER_TEMP}/trigger-context.env"

            source "${RUNNER_TEMP}/trigger-context.env"
          fi

          should_continue="true"
          skip_reason=""

          if [[ "${run_conclusion}" != "success" ]]; then
            should_continue="false"
            skip_reason="Referenced CI run was not successful."
          elif [[ "${run_event}" != "push" ]]; then
            should_continue="false"
            skip_reason="Deploy handoff only supports CI runs triggered by push."
          elif [[ "${head_branch}" != "main" && "${head_branch}" != "develop" ]]; then
            should_continue="false"
            skip_reason="Deploy handoff only supports main/develop CI runs."
          fi

          {
            echo "run_id=${run_id}"
            echo "run_number=${run_number}"
            echo "head_branch=${head_branch}"
            echo "head_sha=${head_sha}"
            echo "run_event=${run_event}"
            echo "run_conclusion=${run_conclusion}"
            echo "should_continue=${should_continue}"
            echo "skip_reason=${skip_reason}"
          } >> "${GITHUB_OUTPUT}"

      - name: Download deploy manifest
        if: steps.trigger.outputs.should_continue == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deploy-manifest
          run-id: ${{ steps.trigger.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/deploy-manifest

      - name: Check out repository
        if: steps.trigger.outputs.should_continue == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Resolve deploy intent
        id: intent
        if: steps.trigger.outputs.should_continue == 'true'
        env:
          HEAD_BRANCH: ${{ steps.trigger.outputs.head_branch }}
          HEAD_SHA: ${{ steps.trigger.outputs.head_sha }}
          RUN_ID: ${{ steps.trigger.outputs.run_id }}
          RUN_NUMBER: ${{ steps.trigger.outputs.run_number }}
          MANIFEST_PATH: ${{ runner.temp }}/deploy-manifest/deploy-manifest.json
        run: |
          if [[ ! -f "${MANIFEST_PATH}" ]]; then
            echo "Missing deploy manifest artifact at ${MANIFEST_PATH}" >&2
            exit 1
          fi

          python3 .github/scripts/export-deploy-intent.py "${MANIFEST_PATH}" > "${RUNNER_TEMP}/deploy-intent.env"

          source "${RUNNER_TEMP}/deploy-intent.env"

          case "${HEAD_BRANCH}" in
            develop)
              expected_environment="dev"
              ;;
            main)
              expected_environment="staging"
              ;;
            *)
              echo "Unsupported branch for deploy handoff: ${HEAD_BRANCH}" >&2
              exit 1
              ;;
          esac

          if [[ "${trigger_branch}" != "${HEAD_BRANCH}" ]]; then
            echo "Deploy manifest branch '${trigger_branch}' did not match workflow branch '${HEAD_BRANCH}'" >&2
            exit 1
          fi

          if [[ "${source_ref}" != "${HEAD_SHA}" ]]; then
            echo "Deploy manifest source_ref '${source_ref}' did not match workflow SHA '${HEAD_SHA}'" >&2
            exit 1
          fi

          if [[ "${source_repository}" != "${GITHUB_REPOSITORY}" ]]; then
            echo "Deploy manifest source repository '${source_repository}' did not match '${GITHUB_REPOSITORY}'" >&2
            exit 1
          fi

          if [[ "${environment}" != "${expected_environment}" ]]; then
            echo "Deploy manifest environment '${environment}' did not match expected '${expected_environment}' for branch '${HEAD_BRANCH}'" >&2
            exit 1
          fi

          if [[ "${should_dispatch}" == "true" && -z "${services}" ]]; then
            echo "Deploy manifest requested dispatch but did not include services." >&2
            exit 1
          fi

          {
            echo "schema_version=${schema_version}"
            echo "should_dispatch=${should_dispatch}"
            echo "environment=${environment}"
            echo "source_repository=${source_repository}"
            echo "services=${services}"
            echo "source_ref=${source_ref}"
            echo "trigger_branch=${trigger_branch}"
            echo "release_sha=${release_sha:-${HEAD_SHA}}"
            echo "release_id=${release_id:-ci-${RUN_ID}-${RUN_NUMBER}}"
            echo "backend_image=${backend_image}"
            echo "backend_image_tag=${backend_image_tag}"
            echo "backend_image_digest=${backend_image_digest}"
            echo "backend_image_ref=${backend_image_ref}"
            echo "frontend_image=${frontend_image}"
            echo "frontend_image_tag=${frontend_image_tag}"
            echo "frontend_image_digest=${frontend_image_digest}"
            echo "frontend_image_ref=${frontend_image_ref}"
            echo "demucs_image=${demucs_image}"
            echo "demucs_image_tag=${demucs_image_tag}"
            echo "demucs_image_digest=${demucs_image_digest}"
            echo "demucs_image_ref=${demucs_image_ref}"
            echo "stable_audio_image=${stable_audio_image}"
            echo "stable_audio_image_tag=${stable_audio_image_tag}"
            echo "stable_audio_image_digest=${stable_audio_image_digest}"
            echo "stable_audio_image_ref=${stable_audio_image_ref}"
          } >> "${GITHUB_OUTPUT}"

      - name: Validate dispatch token
        if: steps.trigger.outputs.should_continue == 'true' && steps.intent.outputs.should_dispatch == 'true'
        env:
          DISPATCH_TOKEN: ${{ secrets.RESONATE_IAC_DISPATCH_TOKEN }}
        run: |
          if [[ -z "${DISPATCH_TOKEN}" ]]; then
            echo "Missing required secret: RESONATE_IAC_DISPATCH_TOKEN" >&2
            exit 1
          fi

      - name: Dispatch deploy intent to resonate-iac
        if: steps.trigger.outputs.should_continue == 'true' && steps.intent.outputs.should_dispatch == 'true'
        env:
          DISPATCH_TOKEN: ${{ secrets.RESONATE_IAC_DISPATCH_TOKEN }}
          SCHEMA_VERSION: ${{ steps.intent.outputs.schema_version }}
          ENVIRONMENT: ${{ steps.intent.outputs.environment }}
          SOURCE_REPOSITORY: ${{ steps.intent.outputs.source_repository }}
          SERVICES: ${{ steps.intent.outputs.services }}
          SOURCE_REF: ${{ steps.intent.outputs.source_ref }}
          TRIGGER_BRANCH: ${{ steps.intent.outputs.trigger_branch }}
          RELEASE_SHA: ${{ steps.intent.outputs.release_sha }}
          RELEASE_ID: ${{ steps.intent.outputs.release_id }}
          BACKEND_IMAGE: ${{ steps.intent.outputs.backend_image }}
          BACKEND_IMAGE_TAG: ${{ steps.intent.outputs.backend_image_tag }}
          BACKEND_IMAGE_DIGEST: ${{ steps.intent.outputs.backend_image_digest }}
          BACKEND_IMAGE_REF: ${{ steps.intent.outputs.backend_image_ref }}
          FRONTEND_IMAGE: ${{ steps.intent.outputs.frontend_image }}
          FRONTEND_IMAGE_TAG: ${{ steps.intent.outputs.frontend_image_tag }}
          FRONTEND_IMAGE_DIGEST: ${{ steps.intent.outputs.frontend_image_digest }}
          FRONTEND_IMAGE_REF: ${{ steps.intent.outputs.frontend_image_ref }}
          DEMUCS_IMAGE: ${{ steps.intent.outputs.demucs_image }}
          DEMUCS_IMAGE_TAG: ${{ steps.intent.outputs.demucs_image_tag }}
          DEMUCS_IMAGE_DIGEST: ${{ steps.intent.outputs.demucs_image_digest }}
          DEMUCS_IMAGE_REF: ${{ steps.intent.outputs.demucs_image_ref }}
          STABLE_AUDIO_IMAGE: ${{ steps.intent.outputs.stable_audio_image }}
          STABLE_AUDIO_IMAGE_TAG: ${{ steps.intent.outputs.stable_audio_image_tag }}
          STABLE_AUDIO_IMAGE_DIGEST: ${{ steps.intent.outputs.stable_audio_image_digest }}
          STABLE_AUDIO_IMAGE_REF: ${{ steps.intent.outputs.stable_audio_image_ref }}
        run: |
          set -euo pipefail
          payload="${RUNNER_TEMP}/repository-dispatch.json"
          python3 - "${payload}" <<'PY'
          import json
          import os
          import sys

          fields = (
              "schema_version",
              "environment",
              "source_repository",
              "source_ref",
              "services",
              "release_sha",
              "release_id",
              "trigger_branch",
              "backend_image",
              "backend_image_tag",
              "backend_image_digest",
              "backend_image_ref",
              "frontend_image",
              "frontend_image_tag",
              "frontend_image_digest",
              "frontend_image_ref",
              "demucs_image",
              "demucs_image_tag",
              "demucs_image_digest",
              "demucs_image_ref",
              "stable_audio_image",
              "stable_audio_image_tag",
              "stable_audio_image_digest",
              "stable_audio_image_ref",
          )
          manifest = {field: os.environ[field.upper()] for field in fields}
          manifest["action"] = "apply"
          # repository_dispatch allows at most 10 top-level client_payload
          # properties; the v2 manifest has 25, which returned a hard 422 and
          # silently blocked every staging deploy. Send it as one JSON string
          # instead. resonate-iac unwraps "manifest" and still accepts the flat
          # shape, so this side can change without a lockstep deploy.
          document = {
              "event_type": os.environ["RESONATE_DEPLOY_EVENT"],
              "client_payload": {
                  "manifest": json.dumps(manifest, separators=(",", ":"), sort_keys=True),
              },
          }
          with open(sys.argv[1], "w", encoding="utf-8") as handle:
              json.dump(document, handle, separators=(",", ":"), sort_keys=True)
              handle.write("\n")
          PY

          curl --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${RESONATE_IAC_REPOSITORY}/dispatches" \
            --data-binary "@${payload}"

      - name: Skip deploy handoff
        if: steps.trigger.outputs.should_continue != 'true' || steps.intent.outputs.should_dispatch != 'true'
        env:
          SKIP_REASON: ${{ steps.trigger.outputs.skip_reason }}
        run: |
          if [[ -n "${SKIP_REASON}" ]]; then
            echo "${SKIP_REASON}"
          else
            echo "No deployable services changed for this successful CI run; skipping deploy handoff."
          fi
